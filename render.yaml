services:
  - type: web
    name: dayzombi-hospedagem
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_DATABASE_URL
        sync: false
      - key: FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_WEB_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
